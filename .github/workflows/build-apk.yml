name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.4 manually
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.4/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK (preinstalled on runner)
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -1)
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found"; exit 1; fi
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"

      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon

      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -v \
            -keystore app/release.jks \
            -alias adskip \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=YunTiao, OU=Personal, O=YunTiao, L=Beijing, ST=Beijing, C=CN"

      - name: Align and sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks app/release.jks \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --out app-release.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          "$BT/apksigner" verify app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YunTiao-apk
          path: |
            app-release.apk
            app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 90
