name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon

      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -v \
            -keystore app/release.jks \
            -alias adskip \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=YunTiao, OU=Personal, O=YunTiao, L=Beijing, ST=Beijing, C=CN"

      - name: Align and sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks app/release.jks \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --out app-release.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          "$BT/apksigner" verify app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YunTiao-apk
          path: |
            app-release.apk
            app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 90
